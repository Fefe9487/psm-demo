name: Deploy PSM demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m pytest -o addopts='' -q
      - uses: actions/cache@v4
        with:
          path: .browser-cache
          key: psm-browser-runtime-${{ hashFiles('scripts/build_browser_demo.py') }}
      - name: Build current application for browsers
        run: python scripts/build_browser_demo.py --output _site-interactive --base-path /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site-interactive

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
