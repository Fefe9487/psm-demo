{% extends "base.html" %}
{% block content %}
<h2>3.14 商業機密</h2>
{% include "_proc.html" %}
<p>協議附件空。文件指回製程／圖號；編號仍可選。</p>
<table class="data">
  <tr><th>文件</th><th>製程</th><th>圖號</th><th>標題</th><th>編號可選</th></tr>
  {% for s in secrets %}
  <tr><td>{{ s.doc_id }}</td><td>{{ s.process_id }}</td><td>{{ s.drawing_no }}</td>
      <td>{{ s.title }}</td><td>{{ '是' if s.ids_selectable else '否' }}</td></tr>
  {% endfor %}
</table>
<form class="grid card" method="post">
  <label>文件編號 <input name="doc_id" required></label>
  <label>標題 <input name="title" required></label>
  <label>製程
    <select name="process_id"><option value=""></option>
      {% for p in processes %}<option value="{{ p.process_id }}">{{ p.process_id }}</option>{% endfor %}
    </select>
  </label>
  <label>圖號
    <select name="drawing_no"><option value=""></option>
      {% for d in drawings %}<option value="{{ d.drawing_no }}">{{ d.drawing_no }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit">新增文件</button>
</form>
{% endblock %}
